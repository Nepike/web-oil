{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Web Oil
        {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header class="header">
        <div class="container header__inner">

            <a
                class="logo"
                href="{% url 'catalog:product_list' %}"
            >
                Web Oil
            </a>

            <nav class="navigation">
                <a href="{% url 'catalog:product_list' %}">
                    Каталог
                </a>

                <a href="#">
                    Доставка
                </a>

                <a href="#">
                    О компании
                </a>
            </nav>

            <div class="header__actions">
                <a href="#">
                    Корзина
                </a>
            </div>

        </div>
    </header>


    <main class="main">
        <div class="container">

            {% block content %}
            {% endblock %}

        </div>
    </main>


    <footer class="footer">
        <div class="container">
            <p>© 2026 Web Oil</p>
        </div>
    </footer>

</body>

</html>
